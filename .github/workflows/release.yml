name: Publish release
on:
  push:
    branches: [main]
    paths:
      - '.claude-plugin/plugin.json'
      - '.claude-plugin/marketplace.json'
      - 'docs/releases/**'
      - '.github/workflows/release.yml'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - run: python scripts/check_skill.py
      - name: Resolve version and notes
        id: version
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          version = json.loads(Path('.claude-plugin/plugin.json').read_text())['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Expected a stable semantic version')
          tag = f'v{version}'
          notes = Path('docs/releases') / f'{tag}.md'
          if not notes.is_file():
              raise SystemExit(f'Missing release notes: {notes}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'tag={tag}\nnotes={notes}\n')
          PY
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NOTES: ${{ steps.version.outputs.notes }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG — Penulisan Bahasa Indonesia Berbasis Konteks" \
              --notes-file "$RELEASE_NOTES" \
              --latest
          fi
